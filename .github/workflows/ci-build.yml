name: Build

on:
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .github/ISSUE_TEMPLATE/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wright-build:
    runs-on: ubuntu-latest
    name: Wright
    env:
      BASTION_BUILD_TOKEN: ${{ secrets.BASTION_BUILD_TOKEN }}
      WRIGHT_VERSION: 0.2.39
      OPY_PROVIDER_VERSION: 0.1.59
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize platform data
        run: pnpm run build

      - name: Install released Wright CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://wrightkit.dev/install.sh \
            | bash -s -- --version "${WRIGHT_VERSION}" --dir "${RUNNER_TEMP}/wright/bin"
          echo "${RUNNER_TEMP}/wright/bin" >> "${GITHUB_PATH}"

      - name: Install pinned OverPy provider
        run: wright provider update opy --version "${OPY_PROVIDER_VERSION}"

      - name: Check Bastion source with Wright and opy-rs
        run: |
          wright check src/main.opy --kind opy --root .
          wright check src/externalMain.opy --kind opy --root .

      - name: Build production entries with Wright
        run: |
          set -euo pipefail
          mkdir -p build
          wright compile src/main.opy --kind opy --root . --locale zh-CN -o build/cn-zh-CN.ow
          wright compile src/externalMain.opy --kind opy --root . --locale en-US -o build/external-en-US.ow

      - name: Check generated Workshop with Wright and workshop-rs
        run: |
          wright check build/cn-zh-CN.ow --kind workshop
          wright check build/external-en-US.ow --kind workshop

      - name: Upload Wright builds
        uses: actions/upload-artifact@v7
        with:
          name: bastion-builds
          path: |
            build/cn-zh-CN.ow
            build/external-en-US.ow
          retention-days: 14
