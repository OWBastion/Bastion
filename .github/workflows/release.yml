name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore
      BASTION_BUILD_TOKEN: ${{ secrets.BASTION_BUILD_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure run is on current main head
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "${latest_main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skip release flow: this run is for ${GITHUB_SHA}, but origin/main is ${latest_main_sha}"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Release flow continues on latest main head: ${GITHUB_SHA}"

      - name: Detect substantive changes
        if: steps.freshness.outputs.should_run == 'true'
        id: substantive_changes
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual release dispatch: substantive-change detection is bypassed"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run: prepare platform sync before deciding whether a release is needed"
            exit 0
          fi

          base_sha="${EVENT_BEFORE:-}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi

          substantive=false
          if ! git diff --quiet --no-ext-diff "${base_sha}" "${GITHUB_SHA}" -- . \
            ':(exclude)src/env/env.opy' \
            ':(exclude)src/constants/event_manifest.opy'; then
            substantive=true
          else
            non_version_diff="$(git diff --no-ext-diff --unified=0 "${base_sha}" "${GITHUB_SHA}" -- \
              src/env/env.opy src/constants/event_manifest.opy | awk '
              /^diff --git / || /^index / || /^--- / || /^\+\+\+ / || /^@@ / { next }
              /^[+-]#!define VERSION "[^"]+"[[:space:]]*$/ || /^[+-]#!define EVENT_MANIFEST_MAIN_VERSION "[^"]+"[[:space:]]*$/ { next }
              /^[+-]/ { print }
            ')"
            if [[ -n "${non_version_diff}" ]]; then
              substantive=true
            fi
          fi

          if [[ "${substantive}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Substantive changes detected between ${base_sha} and ${GITHUB_SHA}"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skip release flow: only release version metadata changed between ${base_sha} and ${GITHUB_SHA}"
          fi

      - name: Setup pnpm
        if: steps.freshness.outputs.should_run == 'true' && steps.substantive_changes.outputs.should_run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        if: steps.freshness.outputs.should_run == 'true' && steps.substantive_changes.outputs.should_run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true' && steps.substantive_changes.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify platform sync credentials
        if: steps.freshness.outputs.should_run == 'true' && steps.substantive_changes.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASTION_BUILD_TOKEN:-}" ]]; then
            echo "::error::BASTION_BUILD_TOKEN repository secret is missing; platform sync cannot run from GitHub Actions."
            exit 1
          fi
          echo "Platform sync credential: configured"

      - name: Sync platform data
        if: steps.freshness.outputs.should_run == 'true' && steps.substantive_changes.outputs.should_run == 'true'
        run: pnpm run sync:platform-data --no-build

      - name: Decide whether release is needed
        if: steps.freshness.outputs.should_run == 'true' && steps.substantive_changes.outputs.should_run == 'true'
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            if git diff --quiet --no-ext-diff -- .; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled platform sync produced no repository changes; release is not needed"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled platform sync changed release inputs:"
              git diff --name-only -- .
            fi
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_EVENT_NAME} trigger requires a release after platform sync"

      - name: Bump env version
        if: steps.release_gate.outputs.should_release == 'true'
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          old_version="$(sed -n 's/^#!define VERSION "\(.*\)"$/\1/p' src/env/env.opy | head -n1)"
          pnpm run tools -- bump:env-version
          new_version="$(sed -n 's/^#!define VERSION "\(.*\)"$/\1/p' src/env/env.opy | head -n1)"

          if [[ -z "${old_version}" || -z "${new_version}" ]]; then
            echo "Failed to parse VERSION from src/env/env.opy" >&2
            exit 1
          fi

          echo "old_version=${old_version}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"

          if [[ "${old_version}" == "${new_version}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Version bump: ${old_version} -> ${new_version}"

      - name: Resolve release tag
        if: steps.release_gate.outputs.should_release == 'true'
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.new_version }}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Build workshop outputs
        if: steps.release_gate.outputs.should_release == 'true'
        run: pnpm run build:main:en && pnpm run build:main:zh

      - name: Commit release inputs back to main
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/env/env.opy src/constants/event_constants.opy src/constants/event_manifest.opy src/locales/zh-CN.opy src/title/title-cn.opy src/map/*.opy src/tools/playerNameToIndex.js src/tools/playerNameToIndexDelimited.js
          if git diff --cached --quiet; then
            echo "No release input changes to commit"
            exit 0
          fi
          git commit -m "chore(release): sync platform data for ${{ steps.release_meta.outputs.version }} [skip release]"
          git push origin HEAD:main

      - name: Ensure git tag exists
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists on origin: ${tag}"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
          echo "Created and pushed tag: ${tag}"

      - name: Generate custom release notes
        if: steps.release_gate.outputs.should_release == 'true'
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${{ steps.release_meta.outputs.tag }}"
          previous_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            commit_range="${previous_tag}..${current_tag}"
          else
            commit_range="${current_tag}"
          fi

          notes_file="release-notes.md"
          {
            echo "Automated release build from \`main\`."
            echo
            echo "## What's Changed"

            line_count=0
            while IFS=$'\t' read -r short_sha subject author; do
              if [[ -z "${short_sha}" ]]; then
                continue
              fi
              if [[ "${subject}" =~ ^chore\(release\):\ bump\ .*\ \[skip\ release\]$ ]]; then
                continue
              fi
              if [[ "${subject}" =~ ^(.*)\ \(\#([0-9]+)\)$ ]]; then
                pr_title="${BASH_REMATCH[1]}"
                pr_number="${BASH_REMATCH[2]}"
                echo "- #${pr_number} ${pr_title} (@${author})"
              else
                echo "- ${short_sha} ${subject} (@${author})"
              fi
              line_count=$((line_count + 1))
            done < <(git log --pretty=format:'%h%x09%s%x09%an' "${commit_range}")

            if [[ "${line_count}" -eq 0 ]]; then
              echo "- No user-facing changes in this release window."
            fi
          } > "${notes_file}"

          echo "body_path=${notes_file}" >> "$GITHUB_OUTPUT"
          echo "Generated ${notes_file} from range: ${commit_range}"

      - name: Publish GitHub Release with build artifacts
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          notes_file="${{ steps.notes.outputs.body_path }}"
          gh release create "${tag}" --title "${tag}" --notes-file "${notes_file}" build/en-US.ow build/zh-CN.ow

      - name: Release summary
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          echo "Version bump: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}"
          echo "Release tag: ${{ steps.release_meta.outputs.tag }}"
          echo "Uploaded artifacts:"
          echo "- build/en-US.ow"
          echo "- build/zh-CN.ow"
